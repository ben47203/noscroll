name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint
        run: shellcheck noscroll install.sh uninstall.sh tests/run.sh
      - name: Test
        run: ./tests/run.sh
